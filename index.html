<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>43期ルート好き顔9選</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f5;
  color: #5a4a45;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

/* 共通 */
.screen {
  min-height: 100vh;
  padding: 30px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* タイトル */
h1 {
  margin: 0 0 10px;
  font-size: 25px;
  font-weight: 700;
  text-align: center;
}

.subtitle {
  margin: 0 0 22px;
  font-size: 14px;
  color: #8b7770;
  text-align: center;
}

/* 問題数 */
.progress {
  margin-bottom: 12px;
  font-size: 13px;
  color: #9b8179;
}

/* 2択 */
.choices {
  width: 100%;
  max-width: 700px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.choice {
  padding: 0;
  border: none;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(80, 50, 40, 0.15);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.choice:active {
  transform: scale(0.97);
}

.choice img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}

/* 結果 */
#result {
  display: none;
}

.result-title {
  margin-bottom: 20px;
}

.result-grid {
  width: 100%;
  max-width: 600px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}

.result-grid img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}

/* もう一度 */
.retry {
  margin-top: 26px;
  padding: 12px 24px;

  border: none;
  border-radius: 999px;

  background: #5a4a45;
  color: white;

  font-size: 14px;
  cursor: pointer;
}

/* スマホ */
@media (max-width: 480px) {

  .screen {
    padding: 24px 10px;
  }

  h1 {
    font-size: 22px;
  }

  .choices {
    gap: 7px;
  }

  .choice {
    border-radius: 10px;
  }
}
</style>
</head>


<body>

<!-- =========================
     ゲーム画面
========================= -->

<div id="game" class="screen">

  <h1>43期ルート好き顔9選</h1>

  <p class="subtitle">
    直感で好きな顔を選んでね！
  </p>

  <div class="progress">
    <span id="current">1</span> / 52
  </div>

  <div class="choices">

    <button class="choice" onclick="choose(0)">
      <img id="imageA" src="images/01.jpg" alt="">
    </button>

    <button class="choice" onclick="choose(1)">
      <img id="imageB" src="images/02.jpg" alt="">
    </button>

  </div>

</div>


<!-- =========================
     結果画面
========================= -->

<div id="result" class="screen">

  <h1 class="result-title">
    好き顔9選
  </h1>

  <div id="resultGrid" class="result-grid"></div>

  <button class="retry" onclick="location.reload()">
    もう一度遊ぶ
  </button>

</div>


<script>

/* =========================
   画像一覧
========================= */

const images = [];

for (let i = 1; i <= 27; i++) {

  const number = String(i).padStart(2, "0");

  images.push("images/" + number + ".jpg");

}


/* =========================
   初期設定
========================= */

const PEOPLE = 27;
const TOTAL_COMPARISONS = 52;

let ratings = Array(PEOPLE).fill(1500);
let wins = Array(PEOPLE).fill(0);

let comparisons = [];
let comparisonIndex = 0;


/* =========================
   52回分の対戦を作る
========================= */

function createComparisons() {

  comparisons = [];

  for (let round = 0; round < 4; round++) {

    let people = Array.from(
      { length: PEOPLE },
      (_, index) => index
    );

    /* 毎ラウンド順番をランダムにする */
    people.sort(() => Math.random() - 0.5);

    /* 2人ずつ対戦 */
    for (let i = 0; i < people.length - 1; i += 2) {

      comparisons.push([
        people[i],
        people[i + 1]
      ]);

    }

  }

}


/* =========================
   Elo方式で順位を更新
========================= */

function updateRating(winner, loser) {

  const winnerRating = ratings[winner];
  const loserRating = ratings[loser];

  const expectedWinner =
    1 /
    (
      1 +
      Math.pow(
        10,
        (loserRating - winnerRating) / 400
      )
    );

  const expectedLoser =
    1 - expectedWinner;

  const K = 32;

  ratings[winner] +=
    K * (1 - expectedWinner);

  ratings[loser] +=
    K * (0 - expectedLoser);

  wins[winner]++;

}


/* =========================
   次の問題を表示
========================= */

function showComparison() {

  if (comparisonIndex >= TOTAL_COMPARISONS) {

    showResult();

    return;
  }

  const pair = comparisons[comparisonIndex];

  document.getElementById("imageA").src =
    images[pair[0]];

  document.getElementById("imageB").src =
    images[pair[1]];

  document.getElementById("current").textContent =
    comparisonIndex + 1;

}


/* =========================
   どちらかを選択
========================= */

function choose(side) {

  const pair = comparisons[comparisonIndex];

  let winner;
  let loser;

  if (side === 0) {

    winner = pair[0];
    loser = pair[1];

  } else {

    winner = pair[1];
    loser = pair[0];

  }

  updateRating(winner, loser);

  comparisonIndex++;

  showComparison();

}


/* =========================
   結果を表示
========================= */

function showResult() {

  const ranking = Array.from(
    { length: PEOPLE },
    (_, index) => index
  );

  /* レーティング順に並べる */

  ranking.sort((a, b) => {

    if (ratings[b] !== ratings[a]) {

      return ratings[b] - ratings[a];

    }

    return wins[b] - wins[a];

  });


  /* 上位9人 */

  const top9 = ranking.slice(0, 9);


  /* ゲーム画面を隠す */

  document.getElementById("game").style.display =
    "none";


  /* 結果画面を表示 */

  document.getElementById("result").style.display =
    "flex";


  const grid =
    document.getElementById("resultGrid");

  grid.innerHTML = "";


  /* 9枚を表示 */

  top9.forEach(index => {

    const img =
      document.createElement("img");

    img.src = images[index];

    img.alt = "";

    grid.appendChild(img);

  });

}


/* =========================
   ゲーム開始
========================= */

createComparisons();

showComparison();

</script>

</body>
</html>
